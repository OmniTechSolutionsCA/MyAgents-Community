name: Community validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-community:
    name: Community / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the Community project boundary
        shell: pwsh
        run: ./community/eng/check-open-core-boundary.ps1

      - name: Restore
        run: dotnet restore MyAgents.Community.slnx

      - name: Build Release
        run: dotnet build MyAgents.Community.slnx --no-restore -c Release

      - name: Test Release
        run: dotnet test MyAgents.Community.slnx --no-build --no-restore -c Release --logger "trx;LogFileName=community.trx"

      - name: Pack Community libraries
        run: dotnet pack MyAgents.Community.slnx --no-build --no-restore -c Release -o artifacts/packages
