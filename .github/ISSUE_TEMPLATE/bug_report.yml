name: Bug report
description: Report a reproducible problem in MyAgents Community.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Never include credentials, customer data, or proprietary source.
  - type: input
    id: version
    attributes:
      label: MyAgents version or commit
      placeholder: Package version or Git SHA
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      placeholder: Output of dotnet --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include steps or a small example. Redact secrets and private data.
      render: text
    validations:
      required: true
